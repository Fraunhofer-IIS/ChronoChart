[project]
name = "ChronoChart"
version = "0.0.1"
description = "Temporal Channel Charting"
authors = [{name = "Majid"}]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
packages = [
    {include = "localization", from = "src"},
    {include = "src"},
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
h5py = ">=3.8,<4.0"
lightning = ">=2.0,<3.0"
matplotlib = ">=3.7,<4.0"
torchjd = { version = "0.8.0", extras = ["full"] }
numpy = ">=1.24,<3.0"
protobuf = ">=4.25,<6.0"
omegaconf = ">=2.3,<3.0"
pandas = ">=2.0,<3.0"
pillow = ">=9.0,<13.0"
pot = ">=0.9,<1.0"
pytorch-metric-learning = ">=2.0,<3.0"
scikit-learn = ">=1.2,<2.0"
scipy = ">=1.10,<2.0"
seaborn = ">=0.12,<1.0"
statsmodels = ">=0.13,<1.0"
tbparse = ">=0.0.9,<1.0"
tensorboard = ">=2.11,<3.0"
tensorflow = ">=2.18,<3.0"
torch = ">=2.0,<4.0"
tqdm = ">=4.57,<6.0"
geomloss = ">=0.2,<1.0"
imageio = ">=2.31,<3.0"
scikit-image = ">=0.21,<1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
